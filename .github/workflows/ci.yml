name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'

jobs:
  # ==============================
  # Lint & Type Check
  # ==============================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: TypeScript Check - Backend
        run: npx tsc --noEmit
        working-directory: apps/backend

      - name: TypeScript Check - Frontend
        run: npx tsc --noEmit
        working-directory: apps/frontend

  # ==============================
  # Unit Tests
  # ==============================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: civicops
          POSTGRES_PASSWORD: civicops_test
          POSTGRES_DB: civicops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Run Migrations
        run: npx prisma migrate deploy --schema=prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://civicops:civicops_test@localhost:5432/civicops_test?schema=public

      - name: Run API Tests
        run: pnpm --filter @civicops/backend test
        env:
          DATABASE_URL: postgresql://civicops:civicops_test@localhost:5432/civicops_test?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_ACCESS_SECRET: test-access-secret-32-characters-min
          JWT_REFRESH_SECRET: test-refresh-secret-32-characters-min

  # ==============================
  # Build
  # ==============================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Build Backend
        run: pnpm --filter @civicops/backend build

      - name: Build Frontend
        run: pnpm --filter @civicops/frontend build
        env:
          NEXT_PUBLIC_API_URL: https://api.civicops.com

  # ==============================
  # Docker Build & Push (main only)
  # ==============================
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Backend image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/civicops-backend:$IMAGE_TAG -t $ECR_REGISTRY/civicops-backend:latest .
          docker push $ECR_REGISTRY/civicops-backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/civicops-backend:latest

      - name: Build & Push Frontend image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f docker/Dockerfile.frontend -t $ECR_REGISTRY/civicops-frontend:$IMAGE_TAG -t $ECR_REGISTRY/civicops-frontend:latest .
          docker push $ECR_REGISTRY/civicops-frontend:$IMAGE_TAG
          docker push $ECR_REGISTRY/civicops-frontend:latest

  # ==============================
  # Deploy (main only)
  # ==============================
  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy Backend to ECS
        run: |
          aws ecs update-service --cluster civicops --service civicops-backend --force-new-deployment

      - name: Deploy Frontend to ECS
        run: |
          aws ecs update-service --cluster civicops --service civicops-frontend --force-new-deployment

      - name: Wait for deployment
        run: |
          aws ecs wait services-stable --cluster civicops --services civicops-backend civicops-frontend
